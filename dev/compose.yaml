# Local Audiobookshelf server for development. See dev/README.md.
services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.1
    ports:
      - '13378:80'
    volumes:
      - ./data/audiobooks:/audiobooks
      - ./data/config:/config
      - ./data/metadata:/metadata
    environment:
      # Dev server only: the e2e suite signs in often; never disable this in production.
      RATE_LIMIT_AUTH_MAX: '0'
    restart: unless-stopped

# Dependency updates. Security fixes come immediately (repository setting); version updates
# weekly, grouped so one pull request carries all minor and patch bumps of an ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Freshly published versions wait a week (supply-chain attacks are usually caught by then).
    # Security fixes are not delayed: they come from the security updates setting.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (native compiler) is not supported by SvelteKit, svelte-check and
      # typescript-eslint yet (tried 2026-10-16); revisit when they announce support.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types follow the lowest supported Node.js (engines: >=24), not the newest.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Must match the tauri-plugin-http crate; both are bumped together by hand.
      - dependency-name: '@tauri-apps/plugin-http'
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

# Release · Desktop: installers for Windows, macOS (universal) and Linux, each with a signed
# build provenance attestation, published as a GitHub pre-release with notes from CHANGELOG.md.
#
#   1. Bump the version in apps/desktop/package.json, src-tauri/tauri.conf.json and
#      src-tauri/Cargo.toml, add "## Desktop X.Y.Z" to CHANGELOG.md, push to main.
#   2. git tag desktop-vX.Y.Z && git push origin desktop-vX.Y.Z
#
# Triggered by desktop-v* or unified v* tags. "Run workflow" by hand
# builds all three platforms as a dry run and keeps the installers as workflow artifacts.
# The installers are not code-signed yet (no certificates): Windows SmartScreen and macOS
# Gatekeeper will warn, so releases are marked as pre-releases until signing is set up.
name: Release · Desktop

on:
  push:
    tags:
      - 'desktop-v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Version, changelog, security gate
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Release builds never restore caches other runs could have written (cache poisoning).
          package-manager-cache: false
      - name: Version, changelog and release policy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs policy
          if [ "$GITHUB_REF_TYPE" = tag ]; then node scripts/release.mjs version "$TAG" desktop; fi
      - name: Security gate
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs gate

  build:
    name: Build (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ''
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/msi/*.msi
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: |
              apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            os: ubuntu-22.04
            args: ''
            bundles: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Release builds never restore caches other runs could have written (cache poisoning).
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.targets }}
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build installers
        shell: bash
        run: pnpm --filter @koalashelf/desktop tauri build ${{ matrix.args }}
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ matrix.bundles }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koalashelf-desktop-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub pre-release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Release builds never restore caches other runs could have written (cache poisoning).
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: koalashelf-desktop-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#desktop-v}"
          version="${version#v}"
          {
            node scripts/release.mjs notes desktop "$version"
            echo
            echo "## Downloads"
            echo
            echo "Windows (.msi or setup .exe), macOS (universal .dmg), Linux (.deb, .rpm, .AppImage)."
            echo "The installers are not code-signed yet: Windows and macOS will ask before opening them."
            echo
            echo "Verify a download: \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`"
          } > notes.md
          gh release create "$TAG" --verify-tag --prerelease --title "KoalaShelf Desktop $version" \
            --notes-file notes.md dist/*

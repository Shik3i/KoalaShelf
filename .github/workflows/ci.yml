# Checks on every push and pull request: types, lint, unit tests, dependency audit, build,
# the Docker image and the end-to-end suite against a local Audiobookshelf with sample books.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every release runs the full checks first (release-web.yml, release-desktop.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a release, github.workflow is the caller: its checks never cancel the push run on main.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, unit tests, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release policy (pinned actions and images, separated roles)
        run: |
          node --test scripts/release.test.mjs
          node scripts/release.mjs policy
      - name: Dependency audit
        run: pnpm audit --audit-level moderate
      - name: Types
        run: pnpm --filter @koalashelf/web check
      - name: Lint
        run: pnpm --filter @koalashelf/web lint
      - name: Unit tests
        run: |
          pnpm --filter @koalashelf/web test
          pnpm --filter @koalashelf/abs-client test
      - name: Build
        run: pnpm --filter @koalashelf/web build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f apps/web/Dockerfile -t koalashelf-web .
      - name: Starts and serves the app
        run: |
          docker run -d --name ks -p 8080:8080 koalashelf-web
          for _ in $(seq 1 30); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<title>'
          curl -fsSI http://localhost:8080/ | grep -qi 'x-frame-options: deny'

  e2e:
    name: End-to-end (Edge)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sample audiobooks and a local Audiobookshelf
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          node dev/make-samples.mjs
          docker compose -f dev/compose.yaml up -d
          node dev/setup-abs.mjs
      - name: Microsoft Edge
        run: pnpm --filter @koalashelf/web exec playwright install --with-deps msedge
      - name: End-to-end tests
        run: pnpm --filter @koalashelf/web test:e2e
      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

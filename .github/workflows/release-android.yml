name: Release · Android

on:
  push:
    tags:
      - 'android-v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Version, changelog and release policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Validate release policy and version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs policy
          if [ "$GITHUB_REF_TYPE" = tag ]; then node scripts/release.mjs version "$TAG" android; fi

  build:
    name: Build Android APK
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build release APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew :app:assembleRelease
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#android-v}"
          version="${version#v}"
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          target_apk="KoalaShelf-${version}.apk"
          cp "$apk" "$target_apk"
          {
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              node scripts/release.mjs notes android "$version"
            else
              echo "Automated APK build of KoalaShelf Android."
            fi
            echo
            echo "## APK Download"
            echo
            echo "Direct installation for Android devices: \`$target_apk\`"
          } > notes.md
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$TAG" --verify-tag --prerelease --title "KoalaShelf Android $version" \
              --notes-file notes.md "$target_apk"
          fi

# Release · Web: the Docker image (web app + Caddy proxy) on GHCR, with signed build
# provenance and SBOM attestations, plus a GitHub Release with notes from CHANGELOG.md.
#
#   1. Bump apps/web/package.json, add "## Web X.Y.Z" to CHANGELOG.md, push to main.
#   2. git tag web-vX.Y.Z && git push origin web-vX.Y.Z
#
# Triggered by web-v* or unified v* tags. "Run workflow"
# by hand builds both architectures as a dry run without publishing anything.
name: Release · Web

on:
  push:
    tags:
      - 'web-v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release that is underway.
concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: nothing is published unless the full CI (incl. end-to-end tests) passes.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, attest, publish
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub Release
      packages: write # push to GHCR
      id-token: write # keyless signing of the attestations
      attestations: write
      artifact-metadata: write
      security-events: read # the CodeQL gate
    env:
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # Release builds never restore caches other runs could have written (cache poisoning).
          package-manager-cache: false

      - name: Version, changelog and release policy
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs policy
          version=$(node -p "require('./apps/web/package.json').version")
          if [ "$PUBLISH" = true ]; then node scripts/release.mjs version "$TAG" web; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Security gate (release commit is main, CodeQL green, no open alerts)
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs gate

      # GHCR paths must be lowercase; the owner login has capitals.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/koalashelf" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }},enable=${{ !startsWith(steps.version.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=KoalaShelf
            org.opencontainers.image.description=Fast, private, self-hostable client for Audiobookshelf (web app / PWA)

      - name: Build (and push)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Built from scratch: no layer cache that other runs could have written.
          no-cache: true
          # Provenance and SBOM are published below as signed attestations instead.
          provenance: false
          sbom: false

      - name: Attest build provenance (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: SBOM (Syft)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            node scripts/release.mjs notes web "$VERSION"
            echo
            echo "## Docker image"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Digest: \`$DIGEST\` (linux/amd64, linux/arm64). Example setup: \`docker-compose.yml\`, \`.env.example\` and \`Caddyfile.example\` below."
            echo
            echo "Verify the signed build provenance and SBOM:"
            echo
            echo '```bash'
            echo "gh attestation verify oci://$IMAGE:$VERSION -R $GITHUB_REPOSITORY"
            echo '```'
          } > notes.md
          gh release create "$TAG" --verify-tag --title "KoalaShelf Web $VERSION" --notes-file notes.md \
            docker-compose.yml .env.example Caddyfile.example sbom.spdx.json

      - name: Summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            if [ "$PUBLISH" = true ]; then echo "### Published $IMAGE"; else echo "### Dry run: built, nothing published"; fi
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)" />
		<meta name="referrer" content="no-referrer" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<title>KoalaShelf</title>
		<script>
			// Apply a manual theme choice before first paint (no flash). "system" needs no class.
			try {
				const t = localStorage.getItem('ks.theme');
				if (t === 'light' || t === 'dark') document.documentElement.classList.add('th-' + t);
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

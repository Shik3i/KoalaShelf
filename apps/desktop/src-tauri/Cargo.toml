[package]
name = "koalashelf"
version = "0.1.0"
description = "KoalaShelf desktop – a private client for Audiobookshelf"
authors = ["KoalaShelf contributors"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "koalashelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-http = "2.8.3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
